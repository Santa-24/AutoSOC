version: "3.8"

services:
  autosoc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosoc-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "80:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AWS_REGION=ap-south-1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
